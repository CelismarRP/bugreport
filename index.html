<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist — Abertura de Bug</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --surface-2: #1a1e28;
      --surface-3: #1f2433;
      --border:    #262c3d;
      --border-hi: #363e56;
      --accent:    #f59e0b;
      --accent-dim:#3b2808;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --blue:      #60a5fa;
      --blue-dim:  #1a2a40;
      --red:       #f87171;
      --red-dim:   #3a1a1a;
      --green:     #4ade80;
      --green-dim: #1a3d28;
      --text:      #e2e8f0;
      --text-muted:#7a8499;
      --text-dim:  #4a5568;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Sora', sans-serif;
      --r: 10px;
      --r-lg: 14px;
    }

    body.light {
      --bg:        #f0f2f7;
      --surface:   #ffffff;
      --surface-2: #f5f7fb;
      --surface-3: #eaecf3;
      --border:    #d8dce8;
      --border-hi: #b8bdd0;
      --accent:    #d97706;
      --accent-dim:#fef3c7;
      --accent-glow: rgba(217, 119, 6, 0.15);
      --blue:      #2563eb;
      --blue-dim:  #dbeafe;
      --red:       #dc2626;
      --red-dim:   #fee2e2;
      --green:     #16a34a;
      --green-dim: #dcfce7;
      --text:      #111827;
      --text-muted:#4b5563;
      --text-dim:  #9ca3af;
    }

    body, body * { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── TOP BAR ── */
    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(13,15,20,0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    body.light .topbar { background: rgba(240,242,247,0.88); }

    .topbar-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .topbar-icon { width: 32px; height: 32px; background: var(--accent); color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .topbar-title { font-family: var(--mono); font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .topbar-title span { color: var(--accent); }

    .topbar-right { display: flex; align-items: center; gap: 24px; }

    .progress-group { display: flex; align-items: center; gap: 12px; font-size: 0.7rem; color: var(--text-muted); font-family: var(--mono); }
    .progress-bar-outer { width: 100px; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar-inner { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; box-shadow: 0 0 8px var(--accent); }

    .topbar-actions { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

    .btn-top { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; font-family: var(--sans); transition: all 0.2s; }
    .btn-copy-top { background: var(--accent); color: #000; }
    .btn-copy-top:hover { background: #fbbf24; transform: translateY(-1px); }
    .btn-clear-top { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .btn-clear-top:hover { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,0.3); }

    .theme-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); font-family: var(--mono); }

    /* ── LAYOUT ── */
    .layout { display: flex; flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; padding: 32px 24px 80px; gap: 28px; }
    .sidebar { width: 190px; flex-shrink: 0; position: sticky; top: 96px; align-self: flex-start; }
    .sidebar-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; font-family: var(--mono); padding-left: 12px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 8px; font-size: 0.76rem; font-weight: 500; color: var(--text-muted); cursor: pointer; text-decoration: none; border: 1px solid transparent; }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active { color: var(--accent); background: var(--accent-dim); border-color: rgba(245,158,11,0.2); }
    .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .main { flex: 1; display: flex; flex-direction: column; gap: 0; min-width: 0; }

    /* ── AUTOCOMPLETE COMPONENT ── */
    .autocomplete-wrapper { position: relative; width: 100%; }
    .autocomplete-list { 
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 999;
      background: var(--surface-3); border: 1px solid var(--accent); border-radius: var(--r);
      max-height: 220px; overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .autocomplete-list.show { display: block; }
    .autocomplete-option { padding: 10px 14px; font-size: 0.78rem; font-family: var(--mono); color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .autocomplete-option:last-child { border-bottom: none; }
    .autocomplete-option:hover { background: var(--accent-dim); color: var(--accent); }
    .autocomplete-option strong { color: var(--accent); }

    /* ── SECTION CARD ── */
    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: visible; animation: fadeUp 0.35s ease both; margin-bottom: 28px;}
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
	.section-card:last-child { margin-bottom: 0; }
    .section-head { padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); border-top-left-radius: var(--r-lg); border-top-right-radius: var(--r-lg); }
    .section-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .icon-yellow { background: var(--accent-dim); }
    .icon-blue   { background: var(--blue-dim); }
    .icon-purple { background: #1e1a36; }
    .icon-green  { background: var(--green-dim); }
    body.light .icon-purple { background: #f3f0ff; }

    .section-head-text h2 { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .section-head-text p { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; }

    .section-lock { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.62rem; font-family: var(--mono); color: var(--text-dim); cursor: pointer; }
    .section-lock input { display: none; }
    .lock-icon { font-size: 14px; opacity: 0.3; transition: all 0.2s; }
    .section-lock input:checked + .lock-icon { opacity: 1; color: var(--accent); }

    .section-body { padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; border-bottom-left-radius: var(--r-lg); border-bottom-right-radius: var(--r-lg); }

    /* ── FIELDS ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-dynamic { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }
    .field-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
    .tag-req { font-size: 0.58rem; font-weight: 700; color: var(--accent); background: var(--accent-dim); border-radius: 4px; padding: 1px 5px; }
    .tag-opt { font-size: 0.65rem; font-weight: 400; color: var(--text-dim); text-transform: none; font-family: var(--sans); }

    input[type="text"], textarea, select { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 14px; font-family: var(--sans); font-size: 0.85rem; color: var(--text); outline: none; width: 100%; }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); background: var(--surface-3); box-shadow: 0 0 0 3px var(--accent-glow); }
    textarea { resize: vertical; }

    /* ── LISTS & STEPS ── */
    .list-container { display: flex; flex-direction: column; gap: 14px; }
    .list-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--surface-2); padding: 14px; border-radius: var(--r); position: relative; }
    .list-num { font-family: var(--mono); font-size: 0.75rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .btn-remove { background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 0.75rem; padding: 5px; transition: color 0.2s; font-family: var(--mono); }
    .btn-remove:hover { color: var(--red); }
    .btn-add { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 1.5px dashed var(--border-hi); border-radius: var(--r); background: transparent; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .step-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .step-input { flex: 1; background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--r); padding: 7px 11px; font-family: var(--sans); font-size: 0.8rem; color: var(--text); outline: none; }
    .step-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ── CHECKLIST ── */
    .checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); font-size: 0.78rem; color: var(--text-muted); cursor: pointer; }
    .check-item.checked { background: var(--accent-dim); border-color: rgba(245,158,11,0.3); color: var(--accent); }
    .check-item input { display: none; }
    .check-box { width: 16px; height: 16px; border: 1.5px solid var(--border-hi); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
    .check-item.checked .check-box { background: var(--accent); border-color: var(--accent); color: #000; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface-3); border: 1px solid var(--accent); border-radius: var(--r); padding: 12px 20px; font-size: 0.8rem; color: var(--accent); font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 999; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ── MENU NAVIGATOR ── */
    .menu-nav-breadcrumb {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--r);
      padding: 10px 14px; font-family: var(--mono); font-size: 0.72rem; min-height: 42px;
    }
    .menu-nav-filter { display: flex; gap: 8px; align-items: center; }
    .menu-nav-filter input {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 8px 12px; font-size: 0.8rem;
      color: var(--text); font-family: var(--sans); outline: none;
    }
    .menu-nav-filter input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn-back {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: var(--r); background: var(--surface-3); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-back:hover { color: var(--text); border-color: var(--border-hi); }
    .btn-back:disabled { opacity: 0.35; cursor: not-allowed; }

    .menu-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .menu-item-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 9px 12px; border-radius: var(--r);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 0.78rem; cursor: pointer;
      font-family: var(--sans); font-weight: 500;
      transition: all 0.18s; text-align: left;
    }
    .menu-item-btn:hover { background: var(--surface-3); border-color: var(--border-hi); color: var(--text); }
    .menu-item-btn.has-children { color: var(--blue); border-color: rgba(96,165,250,0.2); }
    .menu-item-btn.has-children:hover { background: var(--blue-dim); border-color: rgba(96,165,250,0.4); }
    .menu-item-btn .item-arrow { font-size: 0.65rem; opacity: 0.6; flex-shrink: 0; }
    .menu-item-btn.is-leaf.selected { background: var(--accent-dim); border-color: rgba(245,158,11,0.4); color: var(--accent); }

    .menu-nav-result {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--green-dim); border: 1px solid rgba(74,222,128,0.2);
      border-radius: var(--r); padding: 10px 14px;
    }
    .menu-nav-result .result-path {
      flex: 1; font-family: var(--mono); font-size: 0.78rem; color: var(--green); font-weight: 600;
    }
    .btn-copy-path {
      padding: 7px 14px; border-radius: 8px; background: transparent; color: var(--green);
      border: 1px solid rgba(74,222,128,0.3); font-size: 0.73rem; font-weight: 600; cursor: pointer;
      font-family: var(--sans); transition: all 0.2s; white-space: nowrap;
    }
    .btn-copy-path:hover { background: var(--green-dim); }
    .btn-clear-path {
      padding: 7px 10px; border-radius: 8px; background: transparent; color: var(--text-dim);
      border: 1px solid var(--border); font-size: 0.73rem; cursor: pointer;
      font-family: var(--sans); transition: all 0.2s;
    }
    .btn-clear-path:hover { color: var(--red); border-color: rgba(248,113,113,0.3); background: var(--red-dim); }

    .menu-empty { text-align: center; padding: 20px; color: var(--text-dim); font-size: 0.8rem; }

    @media (max-width: 900px) {
      .topbar-right .progress-group { display: none; }
      .sidebar { display: none; }
      .grid-2, .grid-dynamic, .checklist-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-icon">🐞</div>
    <span class="topbar-title">po<span>.</span>bugreport</span>
  </div>

  <div class="topbar-right">
    <div class="progress-group">
      <span id="progressLabel">0 / 0</span>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn-top btn-clear-top" onclick="limparTela()" title="Limpar campos não travados">
        <span>🗑</span> Limpar
      </button>
      <button type="button" class="btn-top btn-copy-top" onclick="copiarParaClipboard()">
        <span>📋</span> Copiar
      </button>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="themeIcon">☀</span> <span id="themeLabel">Claro</span>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Navegação</div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="#sec-caminho"><div class="nav-dot"></div>Caminho no Menu</a>
      <a class="nav-item" href="#sec-descritivo"><div class="nav-dot"></div>Comportamento</a>
      <a class="nav-item" href="#sec-dados"><div class="nav-dot"></div>Ambiente</a>
      <a class="nav-item" href="#sec-checklist"><div class="nav-dot"></div>Checklist</a>
    </nav>
  </aside>

  <main class="main">
  <form id="checklistForm">

    <div class="section-card" id="sec-caminho">
      <div class="section-head">
        <div class="section-icon icon-green">🗺</div>
        <div class="section-head-text">
          <h2>Caminho no Menu</h2>
          <p>Navegue pela hierarquia do sistema para gerar o caminho</p>
        </div>
        <label class="section-lock">
          <input type="checkbox" class="lock-check"> <span class="lock-icon">🔒</span> Manter
        </label>
      </div>
      <div class="section-body">
        <div class="menu-nav-filter">
          <button type="button" class="btn-back" id="menuBtnBack" onclick="menuGoBack()" disabled>← Voltar</button>
          <input type="text" id="menuFilter" placeholder="Filtrar itens..." oninput="menuRender()" autocomplete="off">
        </div>
        <div class="menu-items-grid" id="menuItemsGrid"></div>
        <div class="menu-nav-result" id="menuResult" style="display:none;">
          <span class="result-path" id="menuResultPath"></span>
          <button type="button" class="btn-copy-path" onclick="menuCopiarCaminho()">📋 Copiar Caminho</button>
          <button type="button" class="btn-clear-path" onclick="menuLimparSelecao()" title="Limpar seleção">✕</button>
        </div>
      </div>
    </div>

    <div class="section-card" id="sec-descritivo">
      <div class="section-head">
        <div class="section-icon icon-blue">📝</div>
        <div class="section-head-text">
          <h2>Comportamento</h2>
          <p>O que houve e o que se espera</p>
        </div>
        <label class="section-lock">
          <input type="checkbox" class="lock-check"> <span class="lock-icon">🔒</span> Manter
        </label>
      </div>
      <div class="section-body">
        <div class="field">
          <label class="field-label">Resultado Atual <span class="tag-req">obrigatório</span></label>
          <textarea name="comportamentoAtual" rows="3" required placeholder="Descreva o erro detalhadamente..."></textarea>
        </div>
        <div class="field">
          <label class="field-label">Resultado Esperado <span class="tag-req">obrigatório</span></label>
          <textarea name="comportamentoEsperado" rows="3" required placeholder="Como o sistema deveria funcionar?"></textarea>
        </div>
      </div>
    </div>

    <div class="section-card" id="sec-dados">
      <div class="section-head">
        <div class="section-icon icon-purple">🗄</div>
        <div class="section-head-text">
          <h2>Ambiente</h2>
          <p>Acesso e dados para testes</p>
        </div>
        <label class="section-lock">
          <input type="checkbox" class="lock-check"> <span class="lock-icon">🔒</span> Manter
        </label>
      </div>
      <div class="section-body">
        <div class="grid-2">
          <div class="field">
            <label class="field-label">Instância <span class="tag-req">obrigatório</span></label>
            <select name="instanciaCombo" id="instanciaCombo" required onchange="toggleOutroInstancia()">
              <option value="">Selecione...</option>
              <option value="FOLHATESTEDB\MASTER">FOLHATESTEDB\MASTER</option>
              <option value="FOLHATESTEDB\HOTFIX">FOLHATESTEDB\HOTFIX</option>
              <option value="FOLHATESTEDB\RELEASE">FOLHATESTEDB\RELEASE</option>
              <option value="FOLHATESTEDB\DEVELOP">FOLHATESTEDB\DEVELOP</option>
              <option value="FOLHATEST\SQLSERVERTHEOS">FOLHATEST\SQLSERVERTHEOS</option>
              <option value="FOLHATEST\HOMOLOGACAO">FOLHATEST\HOMOLOGACAO</option>
              <option value="FOLHATEST\RELEASE">FOLHATEST\RELEASE</option>
              <option value="FOLHATEST\DESENVOLVIMENTO">FOLHATEST\DESENVOLVIMENTO</option>
              <option value="OUTRO">OUTRO</option>
            </select>
            <input type="text" name="instanciaManual" id="instanciaManual" style="display:none; margin-top:8px;" placeholder="Digite a instância...">
          </div>
          <div class="field autocomplete-wrapper">
            <label class="field-label">Banco de Dados <span class="tag-req">obrigatório</span></label>
            <input type="text" name="bancoDados" id="bancoDadosInput" required placeholder="Pesquise o banco..." autocomplete="off">
            <div class="autocomplete-list" id="bancoDadosList"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label">Usuário e Perfil <span class="tag-opt">(opcional)</span></label>
            <input type="text" name="usuarioAcesso" placeholder="Ex: suporte.theos">
          </div>
          <div class="field">
            <label class="field-label">Senha <span class="tag-opt">(opcional)</span></label>
            <input type="text" name="senhaAcesso" placeholder="Ex: @Theos2024">
          </div>
        </div>

        <div class="list-container" id="dataList" style="margin-top: 8px;"></div>
        <button type="button" class="btn-add" onclick="adicionarMassaDados()">+ Novo Cenário</button>
      </div>
    </div>

    <div class="section-card" id="sec-checklist">
      <div class="section-head">
        <div class="section-icon icon-blue">✅</div>
        <div class="section-head-text">
          <h2>Checklist</h2>

  // ═══════════════════════════════════════════════════════════════════
  // ESTADO DO NAVEGADOR DE MENU
  // ═══════════════════════════════════════════════════════════════════
  let menuStack   = [];
  let menuCurrent = MENU;
  let menuSelectedPath = '';
  let menuSelectedLeaf = null;

  function menuBuildPath(label) {
    const crumbs = menuStack.map(s => s.node.label);
    crumbs.push(label);
    return crumbs.join(' > ');
  }

  function menuNavigateTo(item) {
    if (item.children) {
      menuStack.push({ node: item });
      menuCurrent = item.children;
      menuSelectedLeaf = null;
      document.getElementById('menuFilter').value = '';
      menuRender();
    }
  }

  function menuGoBack() {
    if (!menuStack.length) return;
    menuStack.pop();
    menuCurrent = menuStack.length ? menuStack[menuStack.length - 1].node.children : MENU;
    menuSelectedLeaf = null;
    document.getElementById('menuFilter').value = '';
    menuRender();
  }

  function menuSelectLeaf(item, btn) {
    if (menuSelectedLeaf) menuSelectedLeaf.classList.remove('selected');
    menuSelectedLeaf = btn;
    btn.classList.add('selected');
    menuSelectedPath = menuBuildPath(item.label);
    document.getElementById('menuResultPath').textContent = menuSelectedPath;
    document.getElementById('menuResult').style.display = 'flex';
  }

  function menuRender() {
    const filter = document.getElementById('menuFilter').value.toLowerCase().trim();
    const grid   = document.getElementById('menuItemsGrid');
    const back   = document.getElementById('menuBtnBack');

    back.disabled = menuStack.length === 0;

    const items = filter ? menuCurrent.filter(i => i.label.toLowerCase().includes(filter)) : menuCurrent;

    if (items.length === 0) {
      grid.innerHTML = '<div class="menu-empty">Nenhum item encontrado.</div>';
      return;
    }

    grid.innerHTML = '';
    items.forEach(item => {
      const hasChildren = !!item.children;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'menu-item-btn' + (hasChildren ? ' has-children' : ' is-leaf');
      const arrow = hasChildren ? '<span class="item-arrow">▶</span>' : '';
      btn.innerHTML = `<span>${item.label}</span>${arrow}`;

      if (hasChildren) btn.onclick = () => menuNavigateTo(item);
      else btn.onclick = () => menuSelectLeaf(item, btn);

      if (!hasChildren && menuStack.length > 0 && menuBuildPath(item.label) === menuSelectedPath) {
        btn.classList.add('selected');
        menuSelectedLeaf = btn;
      }

      grid.appendChild(btn);
    });
  }

  function menuCopiarCaminho() {
    if (!menuSelectedPath) return;
    navigator.clipboard.writeText(menuSelectedPath).then(() => showToast('✓ Caminho copiado!'));
  }

  function menuLimparSelecao() {
    menuSelectedPath = '';
    if (menuSelectedLeaf) { menuSelectedLeaf.classList.remove('selected'); menuSelectedLeaf = null; }
    document.getElementById('menuResult').style.display = 'none';
  }

  menuRender();

  // ── SIDEBAR SCROLL TRACKING ──
  (function() {
    const sections = document.querySelectorAll('.section-card[id]');
    const navItems = document.querySelectorAll('.nav-item');
    const observer = new IntersectionObserver(entries => {
      let best = null, bestRatio = 0;
      entries.forEach(e => { if (e.intersectionRatio > bestRatio) { bestRatio = e.intersectionRatio; best = e.target.id; } });
      if (!best) return;
      navItems.forEach(n => { n.classList.toggle('active', n.getAttribute('href') === '#' + best); });
    }, { threshold: [0, 0.1, 0.3, 0.5, 0.7, 1], rootMargin: '-60px 0px -30% 0px' });
    sections.forEach(s => observer.observe(s));
  })();

  function inicializarAutocomplete(inputId, listId) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    function renderOptions(filterText = "") {
      list.innerHTML = "";
      const term = filterText.toLowerCase();
      const filtered = basesDadosList.filter(d => d.toLowerCase().includes(term));
      
      if(filtered.length === 0) {
        const noRes = document.createElement("div");
        noRes.className = "autocomplete-option";
        noRes.textContent = "Nenhum resultado...";
        list.appendChild(noRes);
        return;
      }

      filtered.forEach(d => {
        const opt = document.createElement("div");
        opt.className = "autocomplete-option";
        if (term) {
          const regex = new RegExp(`(${term})`, "gi");
          opt.innerHTML = d.replace(regex, "<strong>$1</strong>");
        } else {
          opt.textContent = d;
        }

        opt.addEventListener("mousedown", function(e) {
          e.preventDefault();
          input.value = d;
          list.classList.remove("show");
          updateProgress();
        });

        list.appendChild(opt);
      });
    }

    input.addEventListener("focus", () => { renderOptions(input.value); list.classList.add("show"); });
    input.addEventListener("input", (e) => { renderOptions(e.target.value); list.classList.add("show"); });
    input.addEventListener("blur", () => { list.classList.remove("show"); });
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle("light");
    document.getElementById("themeIcon").textContent  = isLight ? "🌙" : "☀";
    document.getElementById("themeLabel").textContent = isLight ? "Escuro" : "Claro";
  }

  function toggleOutroInstancia() {
    const combo  = document.getElementById("instanciaCombo");
    const manual = document.getElementById("instanciaManual");
    manual.style.display = combo.value === "OUTRO" ? "block" : "none";
    if (combo.value === "OUTRO") manual.setAttribute("required", "true");
    else manual.removeAttribute("required");
    updateProgress();
  }

  function limparTela() {
    document.querySelectorAll(".section-card").forEach(section => {
      const lockEl = section.querySelector(".lock-check");
      if (lockEl && lockEl.checked) return;
      
      section.querySelectorAll("input:not(.lock-check), textarea, select").forEach(el => el.value = "");
      
      const manual = section.querySelector("#instanciaManual");
      if (manual) manual.style.display = "none";
      
      const dataList = section.querySelector("#dataList");
      if (dataList) dataList.innerHTML = "";
      
      section.querySelectorAll(".check-item").forEach(ci => {
        ci.classList.remove("checked");
        ci.querySelector("input").checked = false;
        ci.querySelector(".check-box").textContent = "";
      });

      if (section.id === "sec-caminho") {
        menuLimparSelecao();
        menuStack = []; menuCurrent = MENU;
        document.getElementById('menuFilter').value = '';
        menuRender();
      }
    });
    updateProgress();
    showToast("✓ Campos limpos!");
  }

  const checklistItems = [
    "Busquei por tickets duplicados",
    "Validei que não é parametrização",
    "Anexei log ou print no Azure",
    "O cenário existe no banco"
  ];

  const grid = document.getElementById("checklistGrid");
  checklistItems.forEach(item => {
    const label = document.createElement("label");
    label.className = "check-item";
    label.innerHTML = `<input type="checkbox" name="checklist" value="${item}"><div class="check-box"></div>${item}`;
    label.querySelector("input").addEventListener("change", function() {
      label.classList.toggle("checked", this.checked);
      label.querySelector(".check-box").textContent = this.checked ? "✓" : "";
      updateProgress();
    });
    grid.appendChild(label);
  });

  function updateProgress() {
    const fields = document.querySelectorAll("input[required]:not([style*='display: none']), select[required], textarea[required]");
    let filled = 0;
    fields.forEach(f => { if (f.value.trim()) filled++; });
    const pct = fields.length ? Math.round((filled / fields.length) * 100) : 0;
    document.querySelector(".progress-bar-inner").style.width = pct + "%";
    document.getElementById("progressLabel").textContent = `${filled} / ${fields.length}`;
  }

  document.addEventListener("input", updateProgress);

  // ── SCENARIOS & REPRODUÇÃO (PASSOS) ──
  let scenarioCount = 0;
  function adicionarMassaDados() {
    scenarioCount++;
    const id = scenarioCount;
    const list = document.getElementById("dataList");
    const item = document.createElement("div");
    item.className = "list-item data-item";
    item.id = `scenario-${id}`;
    item.style.flexDirection = "column";
    item.style.alignItems = "stretch";

        <div class="field"><label class="field-label">Depto.</label><input type="text" class="data-dep" placeholder="Ex: 1"></div>
        <div class="field"><label class="field-label">Func.</label><input type="text" class="data-fun" placeholder="Ex: 123"></div>
        <div class="field"><label class="field-label" style="text-transform:none;">Trab. s/ vínc.</label><input type="text" class="data-tsv" placeholder="Ex: 456"></div>
      </div>

      <div class="field" style="border-top: 1px dashed var(--border); padding-top: 14px;">
        <label class="field-label" style="color: var(--accent); margin-bottom: 4px;">
          <span style="font-size: 14px;">🧪</span> Reprodução (Passos deste cenário)
        </label>
        <div class="list-container" id="stepList_${id}" style="gap: 0;"></div>
        <button type="button" class="btn-add" style="padding: 8px; margin-top: 6px;" onclick="adicionarPasso(${id})">+ Adicionar Passo</button>
      </div>
    `;
    list.appendChild(item);
  }

  function adicionarPasso(scenarioId) {
    const list = document.getElementById(`stepList_${scenarioId}`);
    const stepId = list.children.length + 1;
    const item = document.createElement("div");
    item.className = "step-item";
    item.innerHTML = `
      <span class="list-num" style="font-size:0.7rem; width: 14px; text-align: right;">${stepId}.</span>
      <input type="text" class="step-input" placeholder="Acesse ou clique em...">
      <button type="button" class="btn-remove" onclick="removerPasso(this, ${scenarioId})">✕</button>
    `;
    list.appendChild(item);
  }

  function removerPasso(btn, scenarioId) {
    btn.parentElement.remove();
    const list = document.getElementById(`stepList_${scenarioId}`);
    Array.from(list.children).forEach((item, index) => {
      item.querySelector('.list-num').textContent = `${index + 1}.`;
    });
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  function montarMarkdown(data) {
    const instancia = data.get("instanciaCombo") === "OUTRO" ? data.get("instanciaManual") : data.get("instanciaCombo");
    
    let t = `### 🏷️ Identificação\n`;
    if (menuSelectedPath) t += `- **Caminho:** \`${menuSelectedPath}\`\n`;
    
    t += `\n### 📝 Comportamento\n**Erro:** ${data.get("comportamentoAtual")}\n\n`;
    t += `**Esperado:** ${data.get("comportamentoEsperado")}\n\n`;
    
    t += `### 🗄️ Dados\n- **Instância:** \`${instancia}\`\n- **Banco:** \`${data.get("bancoDados")}\`\n`;
    if (data.get("usuarioAcesso")) t += `- **Usuário:** ${data.get("usuarioAcesso")}\n`;
    if (data.get("senhaAcesso"))   t += `- **Senha:** ${data.get("senhaAcesso")}\n`;

    const dataItems = document.querySelectorAll("#dataList .data-item");
    if (dataItems.length > 0) {
      t += `\n### 🗂️ Cenários Testados e Reprodução\n\n`;
      dataItems.forEach((item, idx) => {
        const comp = item.querySelector(".data-comp").value.trim();
        const emp = item.querySelector(".data-emp").value.trim();
        const fil = item.querySelector(".data-fil").value.trim();
        const div = item.querySelector(".data-div").value.trim();
        const dep = item.querySelector(".data-dep").value.trim();
        const fun = item.querySelector(".data-fun").value.trim();
        const tsv = item.querySelector(".data-tsv").value.trim();

        // Filtra apenas os campos que foram preenchidos
        const fields = [
          { label: "Comp.", val: comp },
          { label: "Empresa", val: emp },
          { label: "Filial", val: fil },
          { label: "Divisão", val: div },
          { label: "Departamento", val: dep },
          { label: "Func.", val: fun },
          { label: "Trab. s/ vínc.", val: tsv }
        ].filter(f => f.val);

        t += `**Cenário ${idx + 1}**\n\n`;

        if (fields.length > 0) {
          t += `| Campo | Valor |\n|---|---|\n`;
          fields.forEach(f => {
            t += `| **${f.label}** | ${f.val} |\n`;
          });
          t += `\n`;
        }

        const steps = item.querySelectorAll(".step-input");
        if (steps.length > 0) {
          let hasSteps = false;
          steps.forEach((s, i) => { 
            if (s.value.trim()) {
              if(!hasSteps) { t += `**Passos de Reprodução:**\n`; hasSteps = true; }
              t += `${i+1}. ${s.value.trim()}\n`; 
            }
          });
          if(hasSteps) t += `\n`;
        }
        
        t += `---\n\n`;
      });
    }

	const allCheckboxes = document.querySelectorAll('input[name="checklist"]');
    if (allCheckboxes.length > 0) {
      t += `### ✅ Validações QA\n`;
      allCheckboxes.forEach(c => {
        const icone = c.checked ? '✅' : '⬜';
        t += `- ${icone} ${c.value}\n`;
      });
    }
    return t;
  }

  function copiarParaClipboard() {
    const form = document.getElementById("checklistForm");
    if (!form.checkValidity()) { showToast("⚠ Preencha os obrigatórios."); form.reportValidity(); return; }
    const data = new FormData(form);
    navigator.clipboard.writeText(montarMarkdown(data)).then(() => showToast("✓ Copiado para a área de transferência!"));
  }
